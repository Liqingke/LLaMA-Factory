### model
model_name_or_path: /root/paddlejob/workspace/env_run/code/baidu/fengkong/nlp-model/llm/model/DeepSeek-R1-Distill-Qwen-1.5B

### method
stage: sft
do_train: true
finetuning_type: full
#deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: news_train
template: deepseek3
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: workspace/sft/ds-1.5b-sft-news
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
#eval_dataset: news_eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
